<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b21b6">
<title>Poli İşler V5.5</title>
<style>
:root{
  --p:#5b21b6;--p2:#7c3aed;--pl:#f3e8ff;--bg:#f6f7fb;--card:#fff;
  --txt:#172033;--muted:#6b7280;--line:#e6e8ef;--red:#dc2626;--green:#059669;--amber:#d97706;
  --shadow:0 10px 30px rgba(31,41,55,.07)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#faf7ff,#f6f7fb)}
.authbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:0 25px 70px #2e10651a}
.logo{font-size:25px;font-weight:900;margin-bottom:24px}.logo b,.brandMark{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--p),#a855f7);color:#fff;margin-right:9px}
.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:800;color:#667085;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;outline:0;background:#fff}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #7c3aed16}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-weight:750;color:var(--txt)}
.btn:hover{background:#fafafa}.primary{background:var(--p);border-color:var(--p);color:#fff}.primary:hover{background:#4c1d95}.full{width:100%}
.link{border:0;background:none;color:var(--p);font-weight:750}.err{background:#fef2f2;color:#991b1b;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px}

.shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:252px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;z-index:20}
.brand{display:flex;align-items:center;padding:3px 9px 26px;font-size:21px;font-weight:900}
.nav{display:grid;gap:5px}.nav button{border:0;background:none;text-align:left;padding:12px 13px;border-radius:12px;font-weight:750;color:#667085}
.nav button.active,.nav button:hover{background:var(--pl);color:var(--p)}
.sideProfile{position:absolute;left:14px;right:14px;bottom:18px;border-top:1px solid var(--line);padding-top:14px}
.sideUser{font-weight:800;font-size:13px}.sideMail{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis}

.main{margin-left:252px;padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}
.top h1{margin:0;font-size:28px}.muted{color:var(--muted)}.hello{font-size:12px;margin-bottom:4px}.actions{display:flex;gap:8px;align-items:center}.bell{position:relative}.badge{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

.view{display:none}.view.active{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.stat{padding:17px;cursor:pointer;transition:.15s}.stat:hover{transform:translateY(-2px)}.stat small{color:var(--muted);font-weight:650}.stat strong{display:block;font-size:28px;margin-top:7px}.stat .ico{float:right;font-size:20px}
.cardHead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.cardHead h2{margin:0;font-size:18px}.content{padding:15px}
.dashboardGrid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quickGrid .btn{text-align:left;padding:14px}.quickGrid b{display:block}.quickGrid span{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.tab{white-space:nowrap}.tab.active{background:var(--pl);color:var(--p);border-color:#ddd6fe}
.task,.notification,.userRow{padding:13px;border:1px solid var(--line);border-radius:13px;display:flex;gap:10px;align-items:center;margin-bottom:8px;cursor:pointer}
.task:hover,.notification:hover,.userRow:hover{border-color:#c4b5fd}.notification.unread{background:#faf5ff;border-color:#ddd6fe}
.grow{flex:1;min-width:0}.title{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--p);flex:none}.dot.high{background:var(--red)}.dot.low{background:var(--green)}
.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:var(--pl);color:var(--p);font-weight:800;white-space:nowrap}.pill.done{background:#ecfdf5;color:#047857}.pill.late{background:#fef2f2;color:#b91c1c}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--pl);color:var(--p);display:grid;place-items:center;font-weight:900}

.calendarWrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}.calendarCard{padding:0}.calendarToolbar{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.calendarToolbar strong{font-size:18px;text-transform:capitalize}.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px}.dow{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:6px}
.day{min-height:104px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;cursor:pointer;transition:.15s;overflow:hidden}.day:hover{border-color:#c4b5fd;box-shadow:0 6px 18px #7c3aed0c}.day.other{opacity:.38}.day.today{border:2px solid #8b5cf6;padding:7px}.daynum{font-size:12px;font-weight:850;display:flex;justify-content:space-between}
.calEvent{margin-top:6px;font-size:10px;font-weight:750;padding:5px 6px;border-radius:7px;background:#f3e8ff;color:#5b21b6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calEvent.done{background:#ecfdf5;color:#047857;text-decoration:line-through}.agendaItem{padding:12px 0;border-bottom:1px solid var(--line)}.agendaItem:last-child{border-bottom:0}.agendaDate{font-size:11px;font-weight:800;color:var(--p)}.empty{padding:32px 10px;text-align:center;color:var(--muted)}

.modalbg{position:fixed;inset:0;background:#0f172a88;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.modalbg.show{display:flex}
.modal{width:min(650px,100%);background:#fff;border-radius:22px;overflow:auto;max-height:92vh}.mh,.mf{padding:16px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.mh h2{margin:0;font-size:19px}.mf{border-top:1px solid var(--line);border-bottom:0;background:#fafafa}.mb{padding:19px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mobileNav{display:none}

@media(max-width:1000px){.dashboardGrid,.calendarWrap{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:800px){
 .sidebar{display:none}.main{margin:0;padding:15px 14px 80px}.top h1{font-size:23px}.top{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.stats{grid-template-columns:1fr 1fr}
 .mobileNav{display:flex;position:fixed;z-index:50;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--line);justify-content:space-around}
 .mobileNav button{border:0;background:none;color:#667085;font-size:10px;font-weight:800}.mobileNav button.active{color:var(--p)}.mobileNav span{display:block;font-size:20px;margin-bottom:2px}
 .calendarGrid{gap:3px;padding:7px}.day{min-height:72px;padding:5px}.day.today{padding:4px}.calEvent{font-size:8px;padding:4px}.dow{font-size:9px}.row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="auth" class="auth">
<div class="authbox">
<div class="logo"><b>P</b>Poli İşler</div>
<div id="authErr" class="err hidden"></div>
<div id="loginBox">
<div class="field"><label>E-POSTA</label><input id="loginEmail" type="email" autocomplete="email"></div>
<div class="field"><label>ŞİFRE</label><input id="loginPass" type="password" autocomplete="current-password"></div>
<button class="btn primary full" onclick="login()">Giriş Yap</button>
<p style="text-align:center"><button class="link" onclick="forgot()">Şifremi Unuttum</button></p>
</div>
<div id="forgotBox" class="hidden">
<div class="field"><label>E-POSTA</label><input id="forgotEmail" type="email"></div>
<button class="btn primary full" onclick="sendReset()">Sıfırlama Bağlantısı Gönder</button>
<p style="text-align:center"><button class="link" onclick="showLogin()">Girişe dön</button></p>
</div>
<div id="resetBox" class="hidden">
<div class="field"><label>YENİ ŞİFRE</label><input id="newPass" type="password"></div>
<button class="btn primary full" onclick="updatePassword()">Şifreyi Değiştir</button>
</div>
</div>
</section>

<section id="app" class="hidden shell">
<aside class="sidebar">
<div class="brand"><span class="brandMark">P</span> Poli İşler</div>
<nav class="nav">
<button class="active" data-view="home">⌂ &nbsp; Özet</button>
<button data-view="calendar">▣ &nbsp; Kişisel Ajandam</button>
<button data-view="tasks">✓ &nbsp; İşler</button>
<button data-view="team">👥 &nbsp; Ekip</button>
<button onclick="openNotifications()">🔔 &nbsp; Bildirimler</button>
</nav>
<div class="sideProfile"><div class="sideUser" id="sideUser"></div><div class="sideMail" id="sideMail"></div></div>
</aside>

<main class="main">
<div class="top">
<div><div id="hello" class="hello"></div><h1 id="pageTitle">Özet</h1><div id="pageSub" class="muted">Bugünkü işlerini tek ekranda gör.</div></div>
<div class="actions">
<button class="btn bell" onclick="openNotifications()">🔔<span id="notifBadge" class="badge hidden">0</span></button>
<button class="btn primary" onclick="newTask()">＋ Yeni İş</button>
</div>
</div>

<section id="home" class="view active">
<div class="stats">
<div class="stat" onclick="goFilter('all')"><span class="ico">📋</span><small>Toplam İş</small><strong id="stotal">0</strong></div>
<div class="stat" onclick="goFilter('pending')"><span class="ico">⏳</span><small>Bekleyen</small><strong id="spending">0</strong></div>
<div class="stat" onclick="goFilter('late')"><span class="ico">⚠️</span><small>Geciken</small><strong id="slate">0</strong></div>
<div class="stat" onclick="showView('calendar')"><span class="ico">📅</span><small>Kişisel Ajanda</small><strong id="spersonal">0</strong></div>
</div>
<div class="dashboardGrid">
<div class="card"><div class="cardHead"><h2>Bugünün İşleri</h2><button class="btn" onclick="goFilter('all')">Tümünü Gör</button></div><div class="content" id="todayList"></div></div>
<div class="card"><div class="cardHead"><h2>Hızlı İşlemler</h2></div><div class="content quickGrid">
<button class="btn" onclick="newPersonalTask()">📝 <b>Kişisel İş Ekle</b><span>Sadece sen gör</span></button>
<button class="btn" onclick="newAssignedTask()">👤 <b>İş Ata</b><span>Ekip arkadaşına görev</span></button>
<button class="btn" onclick="showView('calendar')">📅 <b>Ajandayı Aç</b><span>Aylık takvim</span></button>
<button class="btn" onclick="showView('team')">👥 <b>Ekibi Gör</b><span>Kullanıcılar</span></button>
</div></div>
</div>
</section>

<section id="calendar" class="view">
<div class="calendarWrap">
<div class="card calendarCard">
<div class="calendarToolbar">
<button class="btn" onclick="moveMonth(-1)">‹</button>
<strong id="monthTitle"></strong>
<div><button class="btn" onclick="goToday()">Bugün</button> <button class="btn primary" onclick="newPersonalTask()">＋ Kişisel İş</button></div>
<button class="btn" onclick="moveMonth(1)">›</button>
</div>
<div class="calendarGrid" id="calendarGrid"></div>
</div>
<div class="card"><div class="cardHead"><h2>Yaklaşan Kişisel İşler</h2></div><div class="content" id="agendaList"></div></div>
</div>
</section>

<section id="tasks" class="view">
<div class="card">
<div class="cardHead"><h2>İşler</h2><button class="btn primary" onclick="newTask()">＋ Yeni İş</button></div>
<div class="content">
<div class="tabs">
<button class="btn tab active" data-filter="all" onclick="filterTasks('all',this)">Tümü</button>
<button class="btn tab" data-filter="personal" onclick="filterTasks('personal',this)">Kişisel</button>
<button class="btn tab" data-filter="pending" onclick="filterTasks('pending',this)">Bekleyen</button>
<button class="btn tab" data-filter="assigned" onclick="filterTasks('assigned',this)">Bana Atanan</button>
<button class="btn tab" data-filter="created" onclick="filterTasks('created',this)">Oluşturduklarım</button>
<button class="btn tab" data-filter="in_progress" onclick="filterTasks('in_progress',this)">Devam Eden</button>
<button class="btn tab" data-filter="late" onclick="filterTasks('late',this)">Geciken</button>
<button class="btn tab" data-filter="completed" onclick="filterTasks('completed',this)">Tamamlanan</button>
</div>
<div id="taskList"></div>
</div>
</div>
</section>

<section id="team" class="view">
<div class="card"><div class="cardHead"><h2>Ekip</h2></div><div class="content" id="teamList"></div></div>
</section>
</main>

<nav class="mobileNav">
<button class="active" data-view="home"><span>⌂</span>Özet</button>
<button data-view="calendar"><span>▣</span>Ajanda</button>
<button data-view="tasks"><span>✓</span>İşler</button>
<button data-view="team"><span>👥</span>Ekip</button>
</nav>
</section>

<div id="mbg" class="modalbg"><div id="modal" class="modal"></div></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://bkwdetbwbworblmamzvo.supabase.co","sb_publishable_E9ixF6m1LhIZ69Jpsa4zeA_db7AE9FP");

let me=null,profile=null,profiles=[],allTasks=[],taskFilter="all",notifications=[],lastUnreadCount=0,audioReady=false,calDate=new Date();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function showErr(x){$("authErr").textContent=x?.message||String(x);$("authErr").classList.remove("hidden")}
function authBox(id){["loginBox","forgotBox","resetBox"].forEach(x=>$(x).classList.toggle("hidden",x!==id));$("authErr").classList.add("hidden")}
window.showLogin=()=>authBox("loginBox");

window.login=async()=>{const email=$("loginEmail").value.trim(),password=$("loginPass").value;if(!email||!password)return showErr("E-posta ve şifre gerekli.");const {error}=await supabase.auth.signInWithPassword({email,password});if(error)return showErr(error);audioReady=true;await start()};
window.forgot=()=>{$("forgotEmail").value=$("loginEmail").value.trim();authBox("forgotBox")};
window.sendReset=async()=>{const email=$("forgotEmail").value.trim();if(!email)return showErr("E-posta gerekli.");const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)return showErr(error);showErr("Şifre yenileme bağlantısı gönderildi.")};
window.updatePassword=async()=>{const password=$("newPass").value;if(!password||password.length<6)return showErr("Şifre en az 6 karakter olmalı.");const {error}=await supabase.auth.updateUser({password});if(error)return showErr(error);authBox("loginBox")};

function modal(h){$("modal").innerHTML=h;$("mbg").classList.add("show")} window.closeM=()=>$("mbg").classList.remove("show");$("mbg").onclick=e=>{if(e.target.id==="mbg")closeM()};

function playNotificationSound(){if(!audioReady)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=820;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.18)}catch(e){}}

window.showView=v=>{document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));$(v).classList.add("active");document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x.dataset.view===v));const map={home:["Özet","Bugünkü işlerini tek ekranda gör."],calendar:["Kişisel Ajandam","Sadece sana ait kişisel takvim ve işler."],tasks:["İşler","Kişisel ve atanan işleri takip et."],team:["Ekip","Ekip arkadaşlarını gör ve iş ata."]};$("pageTitle").textContent=map[v][0];$("pageSub").textContent=map[v][1];if(v==="calendar")renderCalendar()};
document.querySelectorAll("[data-view]").forEach(x=>x.onclick=()=>showView(x.dataset.view));

window.newTask=(presetType="personal",presetDate="")=>{
 const isAssigned=presetType==="assigned";
 modal(`<div class="mh"><h2>${isAssigned?"Yeni İş Ata":"Kişisel İş Ekle"}</h2><button class="btn" onclick="closeM()">×</button></div>
 <div class="mb">
  <div class="field"><label>İŞ BAŞLIĞI</label><input id="tt" placeholder="Örn. Araç evraklarını kontrol et"></div>
  <div class="field"><label>AÇIKLAMA</label><textarea id="td" rows="4"></textarea></div>
  <div class="field"><label>TARİH / SAAT</label><input id="dt" type="datetime-local" value="${presetDate}"></div>
  <div class="field"><label>İŞ TÜRÜ</label><select id="taskType" onchange="toggleAssignee()"><option value="personal" ${!isAssigned?"selected":""}>Kişisel İş</option><option value="assigned" ${isAssigned?"selected":""}>Birine Atanacak İş</option></select></div>
  <div class="field" id="assigneeField" style="display:${isAssigned?"block":"none"}"><label>ATANACAK KİŞİ</label><select id="au">${profiles.map(p=>`<option value="${p.id}">${esc(p.full_name||"İsimsiz")}${p.id===me.id?" (Ben)":""}</option>`).join("")}</select></div>
  <div class="field"><label>ÖNCELİK</label><select id="pr"><option value="normal">Normal</option><option value="high">Yüksek</option><option value="low">Düşük</option></select></div>
 </div>
 <div class="mf"><button class="btn" onclick="closeM()">Vazgeç</button><button class="btn primary" onclick="saveTask()">Kaydet</button></div>`);
};
window.newPersonalTask=()=>newTask("personal"); window.newAssignedTask=()=>newTask("assigned");
window.toggleAssignee=()=>{const a=$("taskType").value==="assigned";$("assigneeField").style.display=a?"block":"none"};

window.saveTask=async()=>{
 const title=$("tt").value.trim(); if(!title)return alert("İş başlığı gerekli.");
 const taskType=$("taskType").value,assignedTo=taskType==="assigned"?$("au").value:me.id;
 const {data:task,error}=await supabase.from("tasks").insert({
   title,description:$("td").value.trim(),due_date:$("dt").value?new Date($("dt").value).toISOString():null,
   created_by:me.id,assigned_to:assignedTo,status:"pending",priority:$("pr").value,task_type:taskType
 }).select("*").single();
 if(error)return alert("İş oluşturulamadı: "+error.message);

 if(taskType==="assigned"&&assignedTo!==me.id){
   const creator=profiles.find(p=>p.id===me.id);
   await supabase.from("notifications").insert({user_id:assignedTo,task_id:task.id,message:`${creator?.full_name||"Bir kullanıcı"} sana yeni bir iş atadı: ${title}`,is_read:false});
 }
 closeM();await loadTasks();await loadNotifications();
};

window.openTask=id=>{
 const t=allTasks.find(x=>String(x.id)===String(id));if(!t)return;
 const a=profiles.find(p=>p.id===t.assigned_to),c=profiles.find(p=>p.id===t.created_by);
 const due=t.due_date?new Date(t.due_date).toLocaleString("tr-TR",{dateStyle:"full",timeStyle:"short"}):"Tarih belirtilmedi";
 modal(`<div class="mh"><h2>${esc(t.title)}</h2><button class="btn" onclick="closeM()">×</button></div><div class="mb"><p>${esc(t.description||"Açıklama yok.")}</p>
 <div class="task"><div class="grow"><b>📅 ${esc(due)}</b><div class="meta">${t.task_type==="personal"?"Kişisel Ajanda":"Atanan İş"}</div></div></div>
 ${t.task_type==="assigned"?`<div class="task"><div class="grow"><b>Atanan:</b> ${esc(a?.full_name||"—")}<div class="meta">Atayan: ${esc(c?.full_name||"—")}</div></div></div>`:""}</div>
 <div class="mf"><button class="btn" onclick="changeStatus('${t.id}','pending')">Bekliyor</button><button class="btn" onclick="changeStatus('${t.id}','in_progress')">Devam Ediyor</button><button class="btn primary" onclick="changeStatus('${t.id}','completed')">Tamamlandı</button></div>`);
};
window.changeStatus=async(id,status)=>{const {error}=await supabase.from("tasks").update({status}).eq("id",id);if(error)return alert("İş durumu güncellenemedi: "+error.message);closeM();await loadTasks()};

function row(t){
 const a=profiles.find(p=>p.id===t.assigned_to),d=t.due_date?new Date(t.due_date):null,late=d&&d<new Date()&&t.status!=="completed";
 const ds=d?d.toLocaleString("tr-TR",{dateStyle:"short",timeStyle:"short"}):"Tarih yok";
 const st=t.status==="completed"?"Tamamlandı":late?"Gecikti":t.status==="in_progress"?"Devam ediyor":"Bekliyor";
 return `<div class="task" onclick="openTask('${t.id}')"><span class="dot ${t.priority==="high"?"high":t.priority==="low"?"low":""}"></span><div class="grow"><div class="title">${esc(t.title)}</div><div class="meta">${esc(ds)} · ${t.task_type==="personal"?"Kişisel":"Atanan İş"}${t.task_type==="assigned"?" · "+esc(a?.full_name||"—"):""}</div></div><span class="pill ${t.status==="completed"?"done":late?"late":""}">${st}</span></div>`;
}

window.loadTasks=async()=>{
 const {data,error}=await supabase.from("tasks").select("*").order("due_date",{ascending:true});
 if(error)return alert("İşler alınamadı: "+error.message);
 allTasks=(data||[]).filter(t=>t.created_by===me.id||t.assigned_to===me.id);
 renderAll();
};

function renderAll(){
 const now=new Date(),personal=allTasks.filter(t=>t.task_type==="personal"&&t.created_by===me.id);
 $("stotal").textContent=allTasks.length;$("spending").textContent=allTasks.filter(t=>t.status==="pending").length;
 $("slate").textContent=allTasks.filter(t=>t.due_date&&new Date(t.due_date)<now&&t.status!=="completed").length;$("spersonal").textContent=personal.filter(t=>t.status!=="completed").length;
 $("todayList").innerHTML=allTasks.filter(t=>t.due_date&&new Date(t.due_date).toDateString()===now.toDateString()).map(row).join("")||'<div class="empty">Bugün için iş yok. 🎉</div>';

 let a=[...allTasks];
 if(taskFilter==="personal")a=a.filter(t=>t.task_type==="personal"&&t.created_by===me.id);
 if(taskFilter==="pending")a=a.filter(t=>t.status==="pending");
 if(taskFilter==="assigned")a=a.filter(t=>t.assigned_to===me.id&&t.task_type==="assigned");
 if(taskFilter==="created")a=a.filter(t=>t.created_by===me.id&&t.task_type==="assigned");
 if(taskFilter==="in_progress")a=a.filter(t=>t.status==="in_progress");
 if(taskFilter==="late")a=a.filter(t=>t.due_date&&new Date(t.due_date)<now&&t.status!=="completed");
 if(taskFilter==="completed")a=a.filter(t=>t.status==="completed");
 $("taskList").innerHTML=a.map(row).join("")||'<div class="empty">Bu filtrede iş yok.</div>';
 renderCalendar();renderTeam();
}
window.filterTasks=(f,el)=>{taskFilter=f;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));el.classList.add("active");renderAll()};
window.goFilter=f=>{taskFilter=f;showView("tasks");document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.filter===f));renderAll()};

function renderCalendar(){
 const personal=allTasks.filter(t=>t.task_type==="personal"&&t.created_by===me.id),y=calDate.getFullYear(),m=calDate.getMonth();
 $("monthTitle").textContent=calDate.toLocaleDateString("tr-TR",{month:"long",year:"numeric"});
 const first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate();
 let html=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x=>`<div class="dow">${x}</div>`).join("");
 for(let i=0;i<42;i++){
   const n=i-start+1,d=new Date(y,m,n),other=d.getMonth()!==m,ds=d.toDateString(),events=personal.filter(t=>t.due_date&&new Date(t.due_date).toDateString()===ds);
   const isoLocal=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}T09:00`;
   html+=`<div class="day ${other?"other":""} ${ds===new Date().toDateString()?"today":""}" onclick="newTask('personal','${isoLocal}')"><div class="daynum"><span>${d.getDate()}</span><span>${events.length?events.length+" iş":""}</span></div>${events.slice(0,3).map(t=>`<div class="calEvent ${t.status==="completed"?"done":""}" onclick="event.stopPropagation();openTask('${t.id}')">${esc(t.title)}</div>`).join("")}</div>`;
 }
 $("calendarGrid").innerHTML=html;
 const upcoming=personal.filter(t=>t.due_date&&new Date(t.due_date)>=new Date()&&t.status!=="completed").sort((a,b)=>new Date(a.due_date)-new Date(b.due_date)).slice(0,8);
 $("agendaList").innerHTML=upcoming.map(t=>`<div class="agendaItem" onclick="openTask('${t.id}')"><div class="agendaDate">${new Date(t.due_date).toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"short"})}</div><div class="title">${esc(t.title)}</div><div class="meta">${new Date(t.due_date).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</div></div>`).join("")||'<div class="empty">Yaklaşan kişisel işin yok.</div>';
}
window.moveMonth=n=>{calDate.setMonth(calDate.getMonth()+n);renderCalendar()};window.goToday=()=>{calDate=new Date();renderCalendar()};

function renderTeam(){
 $("teamList").innerHTML=profiles.map(p=>`<div class="userRow"><div class="avatar">${esc((p.full_name||"?")[0])}</div><div class="grow"><div class="title">${esc(p.full_name||"İsimsiz")}</div><div class="meta">${esc(p.role||"user")}${p.id===me.id?" · Sen":""}</div></div><button class="btn" onclick="event.stopPropagation();newTask('assigned');setTimeout(()=>{document.getElementById('au').value='${p.id}'},0)">İş Ata</button></div>`).join("");
}

async function loadProfiles(){const {data,error}=await supabase.from("profiles").select("id,full_name,role").order("full_name");if(error)return alert("Ekip alınamadı: "+error.message);profiles=data||[]}

async function loadNotifications(){
 if(!me)return;const {data,error}=await supabase.from("notifications").select("*").eq("user_id",me.id).order("created_at",{ascending:false});if(error)return;
 notifications=data||[];const unread=notifications.filter(n=>!n.is_read).length;$("notifBadge").textContent=unread;$("notifBadge").classList.toggle("hidden",unread===0);
 if(unread>lastUnreadCount&&lastUnreadCount!==0)playNotificationSound();lastUnreadCount=unread;
}
window.openNotifications=()=>{const body=notifications.length?notifications.map(n=>`<div class="notification ${n.is_read?"":"unread"}" onclick="openNotification('${n.id}','${n.task_id||""}')"><div class="grow"><div class="title">${esc(n.message)}</div><div class="meta">${new Date(n.created_at).toLocaleString("tr-TR")}</div></div></div>`).join(""):'<div class="empty">Henüz bildirimin yok.</div>';modal(`<div class="mh"><h2>Bildirimler</h2><button class="btn" onclick="closeM()">×</button></div><div class="mb">${body}</div><div class="mf"><button class="btn" onclick="markAllRead()">Tümünü Okundu Yap</button></div>`)};
window.openNotification=async(id,taskId)=>{await supabase.from("notifications").update({is_read:true}).eq("id",id);await loadNotifications();closeM();if(taskId)openTask(taskId)};
window.markAllRead=async()=>{await supabase.from("notifications").update({is_read:true}).eq("user_id",me.id).eq("is_read",false);await loadNotifications();openNotifications()};

async function start(){
 const {data:{session},error}=await supabase.auth.getSession();if(error)return showErr(error);if(!session)return;me=session.user;
 let {data:p,error:pe}=await supabase.from("profiles").select("*").eq("id",me.id).maybeSingle();if(pe)return showErr(pe);
 if(!p){const r=await supabase.from("profiles").insert({id:me.id,full_name:me.user_metadata?.full_name||me.email,role:"user"}).select("*").single();if(r.error)return showErr(r.error);p=r.data}
 profile=p;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("hello").textContent="Hoş geldin, "+(p.full_name||me.email)+" 👋";$("sideUser").textContent=p.full_name||me.email;$("sideMail").textContent=me.email;
 await loadProfiles();await loadTasks();await loadNotifications();setInterval(loadNotifications,15000);
}
supabase.auth.onAuthStateChange(e=>{if(e==="PASSWORD_RECOVERY")authBox("resetBox")});document.addEventListener("click",()=>audioReady=true,{once:true});start();
</script>
