<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d28d9"><link rel="manifest" href="manifest.json"><title>Poli İşler V5</title>
<style>
:root{--p:#6d28d9;--pl:#f1eaff;--bg:#f6f7fb;--line:#e7eaf0;--muted:#6b7280;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 20px 60px #11182718}.logo{font-size:24px;font-weight:900;margin-bottom:25px}.logo b,.brand b{background:linear-gradient(135deg,#6d28d9,#a855f7);color:#fff;border-radius:10px;padding:8px;margin-right:8px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:800;color:#667085;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;outline:0}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-weight:750}.primary{background:var(--p);color:#fff;border-color:var(--p)}.full{width:100%}.err{color:#991b1b;background:#fef2f2;border-radius:10px;padding:10px;margin-bottom:12px;font-size:13px}
.side{position:fixed;inset:0 auto 0 0;width:245px;background:#fff;border-right:1px solid var(--line);padding:22px 14px}.brand{font-size:21px;font-weight:900;padding:4px 10px 26px}.nav button{width:100%;text-align:left;border:0;background:none;padding:12px;border-radius:11px;color:#667085;font-weight:750;margin:3px 0}.nav button.active,.nav button:hover{background:var(--pl);color:var(--p)}main{margin-left:245px;padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:28px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 25px #1f29370d}.stat{padding:17px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:5px}.head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:18px}.content{padding:15px}.task,.user{padding:13px;border:1px solid var(--line);border-radius:13px;display:flex;gap:10px;align-items:center;margin-bottom:8px}.task{cursor:pointer}.dot{width:9px;height:9px;border-radius:50%;background:var(--p);flex:none}.dot.high{background:var(--red)}.main{flex:1;min-width:0}.title{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:3px}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:var(--pl);color:#5b21b6;font-weight:800;white-space:nowrap}.view{display:none}.view.active{display:block}.modalbg{position:fixed;inset:0;background:#0f172a88;backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalbg.show{display:flex}.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:21px}.mh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.mh h2{margin:0;font-size:19px}.mb{padding:20px}.mf{padding:15px 20px;background:#fafafa;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:#f3f4f6;border-radius:9px;width:35px;height:35px;font-size:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--pl);color:var(--p);display:grid;place-items:center;font-weight:900}.mobile{display:none}
@media(max-width:800px){.side{display:none}main{margin:0;padding:15px 14px 80px}.stats{grid-template-columns:1fr 1fr}.top h1{font-size:23px}.mobile{display:flex;position:fixed;z-index:10;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--line);justify-content:space-around}.mobile button{border:0;background:none;color:#667085;font-size:10px;font-weight:800}.mobile button.active{color:var(--p)}.mobile span{display:block;font-size:20px}.row{grid-template-columns:1fr}}
</style></head><body>
<section id="auth" class="auth"><div class="authbox"><div class="logo"><b>P</b>Poli İşler</div><div id="err" class="err hidden"></div>
<div id="login"><h2>Hoş geldin</h2><p class="muted">Poli İşler hesabınla giriş yap.</p><div class="field"><label>E-POSTA</label><input id="le" type="email"></div><div class="field"><label>ŞİFRE</label><input id="lp" type="password"></div><button class="btn primary full" onclick="login()">Giriş Yap</button><p class="muted" style="text-align:center">Hesabın yok mu? <button class="btn" onclick="signupForm()">Kayıt ol</button></p></div>
<div id="signup" class="hidden"><h2>Hesap oluştur</h2><div class="field"><label>AD SOYAD</label><input id="sn"></div><div class="field"><label>E-POSTA</label><input id="se" type="email"></div><div class="field"><label>ŞİFRE</label><input id="sp" type="password"></div><button class="btn primary full" onclick="signup()">Kayıt Ol</button><p style="text-align:center"><button class="btn" onclick="loginForm()">Girişe dön</button></p></div></div></section>
<section id="app" class="hidden"><aside class="side"><div class="brand"><b>P</b>Poli İşler</div><nav class="nav"><button class="active" data-v="home">⌂ &nbsp; Benim Ajandam</button><button data-v="tasks">✓ &nbsp; İşler</button><button data-v="users">👥 &nbsp; Ekip</button><button data-v="settings">⚙ &nbsp; Ayarlar</button></nav></aside>
<main><div class="top"><div><h1 id="heading">Benim Ajandam</h1><div class="muted" id="sub">Kendi işlerini ve sana atanan işleri takip et.</div></div><button class="btn primary" onclick="newTask()">＋ Yeni İş</button></div>
<section id="home" class="view active"><div class="stats"><div class="stat"><small>Toplam</small><strong id="s1">0</strong></div><div class="stat"><small>Bekleyen</small><strong id="s2">0</strong></div><div class="stat"><small>Tamamlanan</small><strong id="s3">0</strong></div><div class="stat"><small>Bana atanan</small><strong id="s4">0</strong></div></div><div class="card"><div class="head"><h2>Ajandam</h2><button class="btn" onclick="loadTasks()">↻ Yenile</button></div><div class="content" id="homeTasks"></div></div></section>
<section id="tasks" class="view"><div class="card"><div class="head"><h2>İşlerim</h2><button class="btn primary" onclick="newTask()">＋ Yeni İş</button></div><div class="content" id="taskList"></div></div></section>
<section id="users" class="view"><div class="card"><div class="head"><h2>Ekip</h2></div><div class="content" id="usersList"></div></div></section>
<section id="settings" class="view"><div class="card"><div class="head"><h2>Hesap</h2></div><div class="content"><div id="profile" class="user"></div><button class="btn" onclick="logout()">Çıkış Yap</button></div></div></section></main>
<nav class="mobile"><button class="active" data-v="home"><span>⌂</span>Ajanda</button><button data-v="tasks"><span>✓</span>İşler</button><button data-v="users"><span>👥</span>Ekip</button><button data-v="settings"><span>⚙</span>Ayarlar</button></nav></section>
<div id="mbg" class="modalbg"><div id="modal" class="modal"></div></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://bkwdetbwbworblmamzvo.supabase.co","sb_publishable_E9ixF6m1LhIZ69Jpsa4zeA_db7AE9FP");
let me=null, profiles=[];
const $=x=>document.getElementById(x), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function err(x){$("err").textContent=x?.message||x;$("err").classList.remove("hidden")}
window.loginForm=()=>{$("signup").classList.add("hidden");$("login").classList.remove("hidden");$("err").classList.add("hidden")}
window.signupForm=()=>{$("login").classList.add("hidden");$("signup").classList.remove("hidden");$("err").classList.add("hidden")}
window.login=async()=>{let {error}=await supabase.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value});if(error)err(error);else start()}
window.signup=async()=>{let {data,error}=await supabase.auth.signUp({email:$("se").value.trim(),password:$("sp").value,options:{data:{full_name:$("sn").value.trim()}}});if(error)return err(error);if(!data.session)return err({message:"Hesap oluşturuldu. E-posta doğrulaması gerekiyorsa gelen kutunu kontrol et."});start()}
window.logout=async()=>{await supabase.auth.signOut();location.reload()}
function openM(x){$("modal").innerHTML=x;$("mbg").classList.add("show")}window.closeM=()=>$("mbg").classList.remove("show");$("mbg").onclick=e=>{if(e.target.id==="mbg")closeM()}
window.newTask=()=>{openM(`<div class="mh"><h2>Yeni İş Ata</h2><button class="close" onclick="closeM()">×</button></div><div class="mb"><div class="field"><label>İŞ BAŞLIĞI</label><input id="tt"></div><div class="field"><label>AÇIKLAMA</label><textarea id="td" rows="4"></textarea></div><div class="row"><div class="field"><label>TARİH / SAAT</label><input id="dt" type="datetime-local"></div><div class="field"><label>ATANACAK KİŞİ</label><select id="au">${profiles.map(p=>`<option value="${p.id}">${esc(p.full_name||p.id)}${p.id===me.id?" (Ben)":""}</option>`).join("")}</select></div></div><div class="field"><label>ÖNCELİK</label><select id="pr"><option value="normal">Normal</option><option value="high">Yüksek</option></select></div></div><div class="mf"><button class="btn" onclick="closeM()">Vazgeç</button><button class="btn primary" onclick="saveTask()">İşi Ata</button></div>`)}
window.saveTask=async()=>{if(!$("tt").value.trim())return alert("İş başlığı gerekli.");let {error}=await supabase.from("tasks").insert({title:$("tt").value.trim(),description:$("td").value,due_data:$("dt").value?new Date($("dt").value).toISOString():null,created_by:me.id,assigned_to:$("au").value,status:"pending"});if(error)return alert(error.message);closeM();loadTasks()}
window.openTask=async id=>{let {data,error}=await supabase.from("tasks").select("*").eq("id",id).single();if(error)return alert(error.message);let a=profiles.find(p=>p.id===data.assigned_to),c=profiles.find(p=>p.id===data.created_by);openM(`<div class="mh"><h2>${esc(data.title)}</h2><button class="close" onclick="closeM()">×</button></div><div class="mb"><p>${esc(data.description||"Açıklama yok.")}</p><div class="task"><div class="main"><b>Atanan</b><div class="meta">${esc(a?.full_name||"—")}</div></div></div><div class="task"><div class="main"><b>Atayan</b><div class="meta">${esc(c?.full_name||"—")}</div></div><span class="pill">${esc(data.status)}</span></div></div><div class="mf"><button class="btn" onclick="status(${data.id},'in_progress')">Devam ediyor</button><button class="btn primary" onclick="status(${data.id},'completed')">Tamamlandı</button></div>`)}
window.status=async(id,s)=>{let {error}=await supabase.from("tasks").update({status:s,update_at:new Date().toISOString()}).eq("id",id);if(error)return alert(error.message);closeM();loadTasks()}
window.loadTasks=async()=>{let {data,error}=await supabase.from("tasks").select("*").order("due_data",{ascending:true});if(error)return alert(error.message);let a=(data||[]).filter(t=>t.created_by===me.id||t.assigned_to===me.id);$("s1").textContent=a.length;$("s2").textContent=a.filter(t=>t.status!=="completed").length;$("s3").textContent=a.filter(t=>t.status==="completed").length;$("s4").textContent=a.filter(t=>t.assigned_to===me.id&&t.created_by!==me.id).length;let rows=a.map(row).join("")||'<div class="muted">Henüz iş yok.</div>';$("homeTasks").innerHTML=rows;$("taskList").innerHTML=rows}
function row(t){let a=profiles.find(p=>p.id===t.assigned_to),c=profiles.find(p=>p.id===t.created_by);let d=t.due_data?new Date(t.due_data).toLocaleString("tr-TR",{dateStyle:"short",timeStyle:"short"}):"Tarih yok";return `<div class="task" onclick="openTask(${t.id})"><span class="dot ${t.priority==="high"?"high":""}"></span><div class="main"><div class="title">${esc(t.title)}</div><div class="meta">${esc(d)} · Atanan: ${esc(a?.full_name||"—")} · Atayan: ${esc(c?.full_name||"—")}</div></div><span class="pill">${t.status==="completed"?"Tamamlandı":t.status==="in_progress"?"Devam ediyor":"Bekliyor"}</span></div>`}
async function loadProfiles(){let {data,error}=await supabase.from("profiles").select("id,full_name,role").order("full_name");if(error)return alert(error.message);profiles=data||[];$("usersList").innerHTML=profiles.map(p=>`<div class="user"><div class="avatar">${esc((p.full_name||"?")[0])}</div><div class="main"><b>${esc(p.full_name||"İsimsiz")}</b><div class="meta">${esc(p.role||"user")}${p.id===me.id?" · Sen":""}</div></div></div>`).join("")}
function nav(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));$(v).classList.add("active");document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("active",x.dataset.v===v));let m={home:["Benim Ajandam","Kendi işlerini ve sana atanan işleri takip et."],tasks:["İşler","İş oluştur, ata ve durumunu takip et."],users:["Ekip","Poli İşler kullanıcıları."],settings:["Ayarlar","Hesabını yönet."]}[v];$("heading").textContent=m[0];$("sub").textContent=m[1]}
document.querySelectorAll("[data-v]").forEach(x=>x.onclick=()=>nav(x.dataset.v));
async function start(){let {data:{session}}=await supabase.auth.getSession();if(!session)return;me=session.user;let {data:p}=await supabase.from("profiles").select("*").eq("id",me.id).single();if(!p){await supabase.from("profiles").insert({id:me.id,full_name:me.user_metadata?.full_name||me.email,role:"user"});p=(await supabase.from("profiles").select("*").eq("id",me.id).single()).data}$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("profile").innerHTML=`<div class="avatar">${esc((p?.full_name||"?")[0])}</div><div class="main"><b>${esc(p?.full_name||me.email)}</b><div class="meta">${esc(me.email)} · ${esc(p?.role||"user")}</div></div>`;await loadProfiles();await loadTasks()}
supabase.auth.onAuthStateChange((e)=>{if(e==="SIGNED_IN")start()});start();
</script></body></html>
